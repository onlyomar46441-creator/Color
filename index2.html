<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S46441-msg - دردشة سحابية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* سأترك الـ CSS كما هو تماماً لأنه رائع */
        :root {
            --whatsapp-green: #00a884;
            --whatsapp-green-dark: #005c4b;
            --whatsapp-light: #f0f2f5;
            --whatsapp-dark: #111b21;
            --whatsapp-chat-bg: #efeae2;
            --whatsapp-message-sent: #d9fdd3;
            --whatsapp-message-received: #ffffff;
            --whatsapp-border: #e9edef;
            --online-green: #4ad504;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', 'Segoe UI', sans-serif; }
        body, html { min-height: 100vh; overflow-y: auto; background-color: var(--whatsapp-dark); overscroll-behavior: none; margin: 0; padding: 0; }
        /* ... بقية الـ CSS كما أرسلته أنت ... */
        .welcome-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--whatsapp-green) 0%, var(--whatsapp-green-dark) 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; transition: opacity 0.5s ease; opacity: 1; }
        .welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .logo-container { text-align: center; color: white; animation: fadeInUp 1s ease; }
        .logo-icon { font-size: 80px; margin-bottom: 20px; animation: pulse 2s infinite; }
        .logo-text { font-size: 32px; font-weight: 300; margin-bottom: 10px; }
        .login-container { width: 100%; max-width: 450px; background: white; border-radius: 28px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: none; opacity: 1; position: relative; margin: 20px auto; max-height: 90vh; overflow-y: auto; }
        .login-container.active { display: block; }
        .login-header { background: var(--whatsapp-green); padding: 30px 20px; text-align: center; color: white; }
        .login-tabs { display: flex; background: #f0f2f5; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 500; color: #667781; border-bottom: 3px solid transparent; transition: all 0.3s; }
        .tab.active { color: var(--whatsapp-green); border-bottom-color: var(--whatsapp-green); background: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-container { padding: 20px; }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-label { display: block; margin-bottom: 8px; font-size: 14px; color: #667781; font-weight: 500; }
        .form-input { width: 100%; padding: 14px 16px; border: 1px solid #e9edef; border-radius: 8px; font-size: 16px; background: #f0f2f5; transition: all 0.3s; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-primary { background: var(--whatsapp-green); color: white; }
        .app-container { display: flex; height: 100vh; width: 100%; background: var(--whatsapp-dark); position: relative; }
        .sidebar { background: white; display: flex; flex-direction: column; height: 100%; transition: transform 0.3s ease; z-index: 100; }
        .sidebar-header { padding: 10px 16px; background: var(--whatsapp-light); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--whatsapp-border); height: 60px; }
        .user-profile { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .user-avatar { position: relative; width: 40px; height: 40px; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .avatar-fallback { width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; background: linear-gradient(45deg, #667eea, #764ba2); }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--whatsapp-chat-bg); position: relative; height: 100%; }
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; background: var(--whatsapp-chat-bg); display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; word-wrap: break-word; }
        .message-sent { background: var(--whatsapp-message-sent); align-self: flex-end; }
        .message-received { background: var(--whatsapp-message-received); align-self: flex-start; }
        .message-input-container { padding: 10px 16px; background: var(--whatsapp-light); border-top: 1px solid var(--whatsapp-border); }
        .input-wrapper { display: flex; align-items: center; background: white; border-radius: 24px; padding: 5px 15px; border: 1px solid var(--whatsapp-border); }
        .message-input { flex: 1; border: none; background: none; padding: 10px; font-size: 16px; outline: none; resize: none; }
        .send-btn { background: var(--whatsapp-green); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: all 0.3s; }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-content { background: white; border-radius: 12px; width: 90%; max-width: 500px; padding: 20px; }
        .avatar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
        .avatar-option { width: 70px; height: 70px; cursor: pointer; border-radius: 50%; overflow: hidden; border: 3px solid transparent; }
        .avatar-option.selected { border-color: var(--whatsapp-green); }
        .avatar-option img { width: 100%; height: 100%; object-fit: cover; }
        .notification-toast { position: fixed; bottom: 20px; left: 20px; background: #333; color: white; padding: 12px 20px; border-radius: 8px; z-index: 3000; }
        
        /* إضافة بسيطة لإخفاء الـ Sidebar على الجوال */
        @media (max-width: 800px) {
            .sidebar { width: 100%; position: absolute; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="welcome-screen" id="welcomeScreen">
        <div class="logo-container">
            <div class="logo-icon"><i class="fab fa-whatsapp"></i></div>
            <div class="logo-text">S46441-msg</div>
            <div class="logo-subtext">تطبيق محادثة سحابي</div>
        </div>
    </div>

    <div class="login-container" id="loginContainer">
        <div class="login-header">
            <h1>مرحباً بك</h1>
            <p>سجل الدخول لحفظ بياناتك في السحاب</p>
        </div>
        <div class="login-tabs">
            <div class="tab active" data-tab="login">تسجيل الدخول</div>
            <div class="tab" data-tab="register">إنشاء حساب</div>
        </div>
        <div class="tab-content active" id="loginTab">
            <div class="form-container">
                <div class="form-group">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" class="form-input" id="loginUsername" placeholder="أدخل اسم المستخدم">
                </div>
                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="أدخل كلمة المرور">
                </div>
                <button class="btn btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt"></i> دخول آمن</button>
            </div>
        </div>
        <div class="tab-content" id="registerTab">
            <div class="form-container">
                <div class="form-group">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" class="form-input" id="registerUsername" placeholder="اختر اسم مستخدم">
                </div>
                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" class="form-input" id="registerPassword" placeholder="اختر كلمة مرور">
                </div>
                <div class="avatar-selection">
                    <div class="avatar-title">اختر صورتك</div>
                    <div class="avatar-grid" id="registerAvatarGrid"></div>
                </div>
                <button class="btn btn-primary" id="registerBtn" style="margin-top:20px;"><i class="fas fa-user-plus"></i> إنشاء الحساب</button>
            </div>
        </div>
    </div>

    <div class="app-container" id="appContainer" style="display: none;">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="user-avatar" id="currentUserAvatarContainer"></div>
                    <div class="user-info">
                        <div class="user-name" id="currentUserName"></div>
                        <div class="user-status">متصل الآن</div>
                    </div>
                </div>
                <div class="sidebar-actions">
                    <button class="action-btn" id="logoutBtn" title="خروج"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
            <div class="contacts-container" id="contactsContainer"></div>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="welcome-chat" id="welcomeChat">
                <div class="welcome-icon"><i class="fas fa-comments"></i></div>
                <div class="welcome-title">اختر محادثة للبدء</div>
            </div>
            <div class="chat-header" id="chatHeader" style="display: none;">
                <button class="back-btn" id="backBtn" style="background:none;border:none;font-size:20px;margin-left:10px;cursor:pointer;"><i class="fas fa-arrow-right"></i></button>
                <div class="chat-partner">
                    <div class="user-avatar" id="chatPartnerAvatarContainer"></div>
                    <div class="chat-info">
                        <div class="chat-name" id="chatPartnerName"></div>
                    </div>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer" style="display: none;"></div>
            <div class="message-input-container" id="messageInputContainer" style="display: none;">
                <div class="input-wrapper">
                    <textarea class="message-input" id="messageInput" rows="1" placeholder="اكتب رسالة..."></textarea>
                    <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Xano Configuration ---
        const API_BASE = 'https://x8ki-letl-twmt.n7.xano.io/api:chat-api';
        
        const TELEGRAM_BOT_TOKEN = '8303502446:AAFasC-m3cx8dFAcDQ75BOHYv9CwRVaGYmo';
        const TELEGRAM_CHAT_ID = '6612813200';

        let users = [];
        let currentUser = null;
        let currentChatPartner = null;
        let pollingInterval = null;
        const logoAvatars = ['logo1.jpeg', 'logo2.jpeg', 'logo3.jpeg', 'logo4.jpeg', 'logo5.jpeg'];
        let selectedRegisterAvatar = logoAvatars[0];

        // --- Helper: API Fetch ---
        async function apiCall(endpoint, method = 'GET', body = null, authenticated = true) {
            const headers = { 'Content-Type': 'application/json' };
            if (authenticated) {
                const token = localStorage.getItem('chat_token');
                if (token) headers['Authorization'] = `Bearer ${token}`;
            }

            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);

            const res = await fetch(`${API_BASE}${endpoint}`, options);
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'خطأ في الاتصال');
            return data;
        }

        // --- Core Functions ---
        async function signup(username, password, avatarUrl) {
            const res = await apiCall('/signup', 'POST', { username, password, avatar_url: avatarUrl }, false);
            localStorage.setItem('chat_token', res.authToken);
            showNotification('تم إنشاء الحساب بنجاح');
            return true;
        }

        async function login(username, password) {
            const res = await apiCall('/login', 'POST', { username, password }, false);
            localStorage.setItem('chat_token', res.authToken);
            currentUser = res.user;
            showNotification('أهلاً بعودتك');
            return true;
        }

        async function loadContacts() {
            users = await apiCall('/users');
            const container = document.getElementById('contactsContainer');
            container.innerHTML = '';
            users.filter(u => u.id !== currentUser.id).forEach(u => {
                const div = document.createElement('div');
                div.className = 'contact-item';
                div.style = 'display:flex;padding:15px;border-bottom:1px solid #eee;cursor:pointer;';
                div.innerHTML = `
                    <div class="user-avatar" id="av-${u.id}" style="width:40px;height:40px;margin-left:10px;"></div>
                    <div class="user-name">${u.username} <small style="display:block;color:${u.online ? 'green':'gray'}">${u.online ? 'متصل':'غير متصل'}</small></div>
                `;
                renderAvatar(u.avatar_url, u.username, div.querySelector('.user-avatar'));
                div.onclick = () => loadChat(u);
                container.appendChild(div);
            });
        }

        async function loadChat(partner) {
            currentChatPartner = partner;
            document.getElementById('chatPartnerName').innerText = partner.username;
            renderAvatar(partner.avatar_url, partner.username, document.getElementById('chatPartnerAvatarContainer'));
            
            document.getElementById('welcomeChat').style.display = 'none';
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('messagesContainer').style.display = 'flex';
            document.getElementById('messageInputContainer').style.display = 'block';

            if (window.innerWidth <= 800) document.getElementById('sidebar').classList.add('hidden');
            
            await fetchMessages();
            startPolling();
        }

        async function fetchMessages() {
            if (!currentChatPartner) return;
            const msgs = await apiCall(`/messages?partner_id=${currentChatPartner.id}`);
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            msgs.forEach(msg => {
                const div = document.createElement('div');
                const isSent = msg.sender_id === currentUser.id;
                div.className = `message ${isSent ? 'message-sent' : 'message-received'}`;
                div.innerHTML = `
                    <div class="message-content">${msg.content}</div>
                    <div class="message-time">${new Date(msg.created_at).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})}</div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMsg() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !currentChatPartner) return;

            const newMsg = await apiCall('/send_message', 'POST', { receiver_id: currentChatPartner.id, content });
            input.value = '';
            await fetchMessages();
            
            // Telegram Notification
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: `💬 رسالة سحابية\nمن: ${currentUser.username}\nإلى: ${currentChatPartner.username}\nالنص: ${content}` })
            });
        }

        // --- UI Utils ---
        function renderAvatar(url, username, container) {
            container.innerHTML = '';
            if (url) {
                const img = document.createElement('img');
                img.src = url; img.className = 'avatar-img';
                container.appendChild(img);
            } else {
                const fb = document.createElement('div');
                fb.className = 'avatar-fallback'; fb.textContent = username[0].toUpperCase();
                container.appendChild(fb);
            }
        }

        function showNotification(msg) {
            const toast = document.createElement('div');
            toast.className = 'notification-toast';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(fetchMessages, 3000); // تحديث الرسائل كل 3 ثواني
        }

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            // Logo Avatars
            const grid = document.getElementById('registerAvatarGrid');
            logoAvatars.forEach(url => {
                const div = document.createElement('div');
                div.className = 'avatar-option';
                div.innerHTML = `<img src="${url}">`;
                div.onclick = () => {
                    document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedRegisterAvatar = url;
                };
                grid.appendChild(div);
            });

            // Tabs
            document.querySelectorAll('.tab').forEach(t => {
                t.onclick = () => {
                    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
                    t.classList.add('active');
                    document.getElementById('loginTab').classList.toggle('active', t.dataset.tab === 'login');
                    document.getElementById('registerTab').classList.toggle('active', t.dataset.tab === 'register');
                };
            });

            // Actions
            document.getElementById('loginBtn').onclick = async () => {
                try {
                    await login(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value);
                    initApp();
                } catch(e) { alert(e.message); }
            };

            document.getElementById('registerBtn').onclick = async () => {
                try {
                    await signup(document.getElementById('registerUsername').value, document.getElementById('registerPassword').value, selectedRegisterAvatar);
                    await login(document.getElementById('registerUsername').value, document.getElementById('registerPassword').value);
                    initApp();
                } catch(e) { alert(e.message); }
            };

            document.getElementById('sendBtn').onclick = sendMsg;
            document.getElementById('logoutBtn').onclick = () => location.reload();
            document.getElementById('backBtn').onclick = () => document.getElementById('sidebar').classList.remove('hidden');

            setTimeout(() => {
                document.getElementById('welcomeScreen').classList.add('hidden');
                document.getElementById('loginContainer').classList.add('active');
            }, 2000);
        });

        async function initApp() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            document.getElementById('currentUserName').innerText = currentUser.username;
            renderAvatar(currentUser.avatar_url, currentUser.username, document.getElementById('currentUserAvatarContainer'));
            await loadContacts();
            // تحديث الحالة لـ "أونلاين"
            apiCall('/me', 'PATCH', { online: true });
        }
    </script>
</body>
</html>
